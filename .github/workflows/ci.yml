name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # vitest strips types without checking them, so a type error only
      # shows up here.
      - name: Typecheck
        run: npm run build

      # README.md is rendered from src/README.md.ejs and managers.csv by
      # `npm start`. The output is deterministic (END_DATE freezes "today"
      # and the Monte Carlo RNG is seeded), so any diff means a source
      # changed without regenerating the README.
      - name: README is up to date
        run: |
          npm start > /dev/null
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::README.md is out of date. Run npm start and commit the result."
            exit 1
          fi
